# Grouped monthly Dependabot configuration (SWAL wave pi-1, S7).
# One pull request per ecosystem per month instead of one PR per bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      # Version updates: everything into a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a monthly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript 7 (native compiler) does not expose the programmatic API
      # that `astro check` needs, so the whole gate goes red. Pinned to 5.9.3
      # in pnpm-workspace.yaml overrides and in each package.json.
      # Remove this ignore (and the pin) when Astro supports TS 7:
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/cores/gos-client"
    schedule:
      interval: "monthly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      # Version updates: everything into a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a monthly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/src-astro"
    schedule:
      interval: "monthly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      # Version updates: everything into a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a monthly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      # Version updates: everything into a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a monthly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
